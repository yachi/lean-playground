name: Lean Action CI

# Branch pushes get CI through their pull request; a push trigger on every
# branch as well ran each PR commit twice.
# Markdown-only changes build nothing.
on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md']
  pull_request:
    paths-ignore: ['**/*.md']
  workflow_dispatch:

# A new push to a PR cancels its older run; main runs every commit.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Modules too big to build side by side: each takes ~3 GB and up to 20 min,
  # and four at once on a 16 GB runner got the job killed. Each gets a job.
  HEAVY: LeanPlayground.PerfectCuboid.Fibers.*
  # Heavy modules to start first, slowest first (timings from run 61).
  SLOW_FIRST: >-
    LeanPlayground.PerfectCuboid.Fibers.F_52_677
    LeanPlayground.PerfectCuboid.Fibers.F_684_1525
    LeanPlayground.PerfectCuboid.Fibers.F_228_397
    LeanPlayground.PerfectCuboid.Fibers.F_400_689
    LeanPlayground.PerfectCuboid.Fibers.F_432_793
    LeanPlayground.PerfectCuboid.Fibers.F_644_725
    LeanPlayground.PerfectCuboid.Fibers.F_336_625
    LeanPlayground.PerfectCuboid.Fibers.F_736_785

# The build runs in three stages that share one cache of the project's own
# .lake/build, saved from main and restored everywhere, so a run rebuilds only
# the modules whose sources (or imports) changed:
#   core:  every module that imports no heavy module, in one job, then lists
#          the heavy modules that are out of date;
#   heavy: one job per out-of-date heavy module, all in parallel;
#   build: the rest (FiberList, the root), from the cache plus the outputs of
#          the other jobs, passed along as artifacts.
# When no heavy module is out of date (most runs), `core` builds the rest
# itself and saves the cache, and `heavy` and `build` are skipped.
# Mathlib's oleans come from `lake exe cache get` in each job, as before.
jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read # Read access to repository contents
    outputs:
      cache-key: ${{ steps.cache.outputs.cache-matched-key }}
      heavy: ${{ steps.plan.outputs.heavy }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # lean-action's own cache keys all of .lake per commit (~2 GB each), which
      # overflows the 10 GB repo limit, so only .lake/build is cached here.
      - uses: leanprover/lean-action@24581d74d674803a25a81b10b059c5c0cdd344c6 # v1
        with:
          use-github-cache: "false"
          build: "false"
      - id: cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .lake/build
          key: >-
            lake-build-v1-${{ runner.os }}-${{ hashFiles('lean-toolchain',
            'lake-manifest.json') }}-${{ github.sha }}
          restore-keys: >-
            lake-build-v1-${{ runner.os }}-${{ hashFiles('lean-toolchain',
            'lake-manifest.json') }}-
      - run: touch "$RUNNER_TEMP/stamp"
      - id: plan
        run: |
          python3 scripts/ci_plan.py LeanPlayground "$HEAVY" $SLOW_FIRST > "$RUNNER_TEMP/plan.json"
          jq -r '.core[]' "$RUNNER_TEMP/plan.json" | xargs -r lake build
          # `--no-build` exits non-zero when the module would be rebuilt.
          # Check all heavy modules in one call first: each call loads the
          # whole workspace (~1.5 s), so one call per module took ~2 min.
          mapfile -t heavy < <(jq -r '.heavy[]' "$RUNNER_TEMP/plan.json")
          stale=()
          if ! lake build --no-build "${heavy[@]}" > /dev/null 2>&1; then
            for m in "${heavy[@]}"; do
              lake build --no-build "$m" > /dev/null 2>&1 || stale+=("$m")
            done
          fi
          echo "Out of date: ${#stale[@]} heavy module(s): ${stale[*]}"
          echo "heavy=$(jq -cn '$ARGS.positional' --args "${stale[@]}")" >> "$GITHUB_OUTPUT"
      # Nothing heavy to build: finish here instead of in `build`, which would
      # set up Lean and Mathlib again (~2 min) for a ~20 s build.
      - if: steps.plan.outputs.heavy == '[]'
        run: lake build
      - if: >-
          steps.plan.outputs.heavy == '[]' && github.event_name == 'push' &&
          github.ref == 'refs/heads/main'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .lake/build
          key: >-
            lake-build-v1-${{ runner.os }}-${{ hashFiles('lean-toolchain',
            'lake-manifest.json') }}-${{ github.sha }}-${{ github.run_attempt }}
      # Only the files built here; the next jobs restore the same cache first.
      - if: steps.plan.outputs.heavy != '[]'
        run: >-
          find .lake/build -type f -newer "$RUNNER_TEMP/stamp" -print0 |
          tar --null -czf "$RUNNER_TEMP/core.tgz" -T -
      - if: steps.plan.outputs.heavy != '[]'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-core
          path: ${{ runner.temp }}/core.tgz
          retention-days: 1
          compression-level: 0

  heavy:
    needs: core
    if: needs.core.outputs.heavy != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read # Read access to repository contents
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJSON(needs.core.outputs.heavy) }}
    name: heavy (${{ matrix.module }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: leanprover/lean-action@24581d74d674803a25a81b10b059c5c0cdd344c6 # v1
        with:
          use-github-cache: "false"
          build: "false"
      - if: needs.core.outputs.cache-key != ''
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .lake/build
          key: ${{ needs.core.outputs.cache-key }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build-core
          path: ${{ runner.temp }}
      - run: |
          tar -xzf "$RUNNER_TEMP/core.tgz"
          touch "$RUNNER_TEMP/stamp"
      - run: lake build "${{ matrix.module }}"
      - run: >-
          find .lake/build -type f -newer "$RUNNER_TEMP/stamp" -print0 |
          tar --null -czf "$RUNNER_TEMP/heavy.tgz" -T -
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-heavy-${{ matrix.module }}
          path: ${{ runner.temp }}/heavy.tgz
          retention-days: 1
          compression-level: 0

  build:
    needs: [core, heavy]
    # Also after a failed heavy job, so the cache keeps the modules that built.
    if: >-
      !cancelled() && needs.core.result == 'success' &&
      needs.core.outputs.heavy != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read # Read access to repository contents
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: leanprover/lean-action@24581d74d674803a25a81b10b059c5c0cdd344c6 # v1
        with:
          use-github-cache: "false"
          build: "false"
      - if: needs.core.outputs.cache-key != ''
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .lake/build
          key: ${{ needs.core.outputs.cache-key }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: build-*
          path: ${{ runner.temp }}/outputs
      # Core first: the heavy outputs are newer and must win.
      - run: |
          for f in "$RUNNER_TEMP"/outputs/build-core/*.tgz "$RUNNER_TEMP"/outputs/build-heavy-*/*.tgz; do
            [ -e "$f" ] && tar -xzf "$f"
          done
          true
      - if: needs.heavy.result != 'failure'
        run: lake build
      - if: >-
          !cancelled() && github.event_name == 'push' &&
          github.ref == 'refs/heads/main'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .lake/build
          key: >-
            lake-build-v1-${{ runner.os }}-${{ hashFiles('lean-toolchain',
            'lake-manifest.json') }}-${{ github.sha }}-${{ github.run_attempt }}
      - if: needs.heavy.result == 'failure'
        run: |
          echo "::error::A heavy module failed to build; see the heavy jobs."
          exit 1

  # Publish API docs to https://yachi.github.io/lean-playground/docs/ from main only;
  # the github-pages environment rejects deploys from other branches.
  # `build` is skipped when `core` finished the build, and a skipped job in
  # `needs` skips this one unless the condition checks results itself (which
  # is why docs had not been deployed since the jobs were split).
  docs:
    needs: [core, build]
    if: >-
      !cancelled() && needs.core.result == 'success' &&
      (needs.build.result == 'success' || needs.build.result == 'skipped') &&
      github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # One Pages deploy at a time; a queued run then restores the entry the
    # running one saves instead of rebuilding docInfo in parallel.
    concurrency:
      group: pages
      cancel-in-progress: false
    # Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
    permissions:
      contents: read # Read access to repository contents
      pages: write # Write access to GitHub Pages
      id-token: write # Write access to ID tokens

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # docgen-action needs elan and Mathlib's oleans in ./.lake/packages.
      # The `:docs` facet builds the project itself, and `build` above has
      # already checked that it compiles.
      - uses: leanprover/lean-action@24581d74d674803a25a81b10b059c5c0cdd344c6 # v1
        with:
          use-github-cache: "false"
          build: "false"
      # Keep doc-gen4's compiled tools and the docInfo database, so only the
      # project's own modules are re-analysed. One entry per toolchain and
      # manifest; a Mathlib bump restores the previous entry and rebuilds
      # only what changed. Bump the v1 prefix to start from scratch.
      # Restore and save are split so a failure after the docs build (e.g. the
      # Pages deploy) still keeps the ~35 min of docInfo work.
      - id: docgen-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            .lake/packages/doc-gen4
            .lake/packages/leansqlite
            .lake/packages/UnicodeBasic
            .lake/packages/BibtexQuery
            .lake/packages/MD4Lean
            .lake/packages/Cli/.lake/build
            docbuild/.lake/build
          key: >-
            docgen-v1-${{ runner.os }}-${{ runner.arch }}-${{
            hashFiles('lean-toolchain') }}-${{
            hashFiles('lake-manifest.json') }}
          restore-keys: >-
            docgen-v1-${{ runner.os }}-${{ runner.arch }}-${{
            hashFiles('lean-toolchain') }}-
      # Force the HTML pass (~1 min) so pages always match the database,
      # even when the docs_built marker in the cache is still up to date.
      - run: rm -f docbuild/.lake/build/doc-data/*.docs_built
      - uses: leanprover-community/docgen-action@56dff2bb89f3e9b8c1b6d5c8410362c19de2d904 # v1
      # A docs_built marker exists only if fromDb finished this run, which
      # needs every docInfo job to have succeeded, so the database is whole.
      - if: >-
          !cancelled() && steps.docgen-cache.outputs.cache-hit != 'true' &&
          hashFiles('docbuild/.lake/build/doc-data/*.docs_built') != ''
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          # Same list as the restore step above.
          path: |
            .lake/packages/doc-gen4
            .lake/packages/leansqlite
            .lake/packages/UnicodeBasic
            .lake/packages/BibtexQuery
            .lake/packages/MD4Lean
            .lake/packages/Cli/.lake/build
            docbuild/.lake/build
          key: ${{ steps.docgen-cache.outputs.cache-primary-key }}
